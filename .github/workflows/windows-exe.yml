name: Windows EXE assets

# Builds the app folder (dist\SceneBoard\SceneBoard.exe) and its shareable zip
# with the real build.bat on a clean Windows runner, then verifies that every
# high-resolution asset pack from the GitHub release is bundled byte-for-byte,
# that the EXE carries the app icon, and that a first launch installs the packs
# intact. Use "Run workflow" on the Actions tab to re-check the release at any time.
on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - build.bat
      - filter_asset_packs.py
      - verify_exe_assets.py
      - make_icon.py
      - main.py
      - requirements.txt
      - core/asset_manager.py
      - core/mapbuilder.py
      - ui/app_icon.py
      - ui/icons/**
      - ui/branding.py
      - ui/library.py
      - ui/main_window.py
      - .github/workflows/windows-exe.yml

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build the app and verify bundled assets
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build dist\SceneBoard with build.bat
        shell: cmd
        # build.bat ends with "pause"; NUL input lets it continue unattended.
        run: |
          call build.bat < NUL
          if errorlevel 1 exit /b 1
          if not exist dist\SceneBoard\SceneBoard.exe (
            echo build.bat finished without producing dist\SceneBoard\SceneBoard.exe
            exit /b 1
          )
          if not exist dist\SceneBoard-Windows.zip (
            echo build.bat finished without producing dist\SceneBoard-Windows.zip
            exit /b 1
          )
      - name: Verify the release assets in the finished build
        shell: cmd
        run: >-
          venv\Scripts\python.exe verify_exe_assets.py
          --exe dist\SceneBoard\SceneBoard.exe
          --zip dist\SceneBoard-Windows.zip
          --icon ui\icons\SceneBoard.ico
          --source-dir "%TEMP%\SceneBoard-highres-packs"
          --filtered-dir "%TEMP%\SceneBoard-supported-asset-packs"
          --expect RPG-Mobius-Geomorphs-Geomorphs-High-Res-Teal.zip
          --expect RPG-Mobius-Geomorphs-Custom-Tiles-High-Res-Teal.zip
          --expect RPG-Mobius-Geomorphs-Symbols-High-Res-Teal.zip
          --launch --require-fresh
