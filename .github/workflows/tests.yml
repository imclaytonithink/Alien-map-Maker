name: Tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libegl1 libgl1 libxkbcommon0
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Run unit and offscreen GUI checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run_tests.py --require-gui

  real-pack-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download the published high-resolution asset packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/sceneboard-packs"
          gh release download asset-intake-temp-20261006 \
            --repo imclaytonithink/Alien-map-Maker \
            --pattern 'RPG-Mobius-Geomorphs-*-High-Res-Teal.zip' \
            --dir "$RUNNER_TEMP/sceneboard-packs"
      - name: Import real packs and generate a sample map
        run: >-
          python test_pack_integration.py
          --packs-dir "$RUNNER_TEMP/sceneboard-packs"
          --taxonomy-report "$RUNNER_TEMP/asset-taxonomy-report.md"
      - name: Install Pillow for the visual audit
        if: success() && github.event_name == 'push' && (contains(github.event.head_commit.message, '[asset-visual-audit]') || contains(github.event.head_commit.message, '[asset-large-visual-audit]'))
        run: python -m pip install --disable-pip-version-check 'Pillow>=9.0'
      - name: Build contact sheets for manual review of every pack image
        if: success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[asset-visual-audit]')
        run: |
          python visual_asset_audit.py \
            --packs-dir "$RUNNER_TEMP/sceneboard-packs" \
            --output "$RUNNER_TEMP/asset-visual-audit.zip"
      - name: Build contact sheets for the very-large images
        if: success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[asset-large-visual-audit]')
        run: |
          python visual_asset_audit.py \
            --packs-dir "$RUNNER_TEMP/sceneboard-packs" \
            --output "$RUNNER_TEMP/large-image-visual-audit.zip" \
            --large-images-only
      - name: Publish representative contact sheets for direct visual review
        if: success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[asset-visual-audit]')
        env:
          BUNDLE_PATH: ${{ runner.temp }}/asset-visual-audit.zip
          LARGE_BUNDLE_PATH: ${{ runner.temp }}/large-image-visual-audit.zip
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import os
          import subprocess
          import time
          import zipfile

          pack_names = ("geomorphs", "custom_tiles", "symbols")
          bundle_paths = [("full", os.environ["BUNDLE_PATH"])]
          large_path = os.environ["LARGE_BUNDLE_PATH"]
          if os.path.isfile(large_path):
              bundle_paths.append(("large", large_path))

          review = io.BytesIO()
          manifest = io.StringIO(newline="")
          writer = csv.writer(manifest, delimiter="\t", lineterminator="\n")
          header = None
          selected_count = 0
          with zipfile.ZipFile(review, "w", zipfile.ZIP_DEFLATED,
                               compresslevel=6) as output:
              for bundle_kind, source_path in bundle_paths:
                  with zipfile.ZipFile(source_path) as source:
                      sheets = [name for name in source.namelist()
                                if name.startswith("sheets/") and name.endswith(".jpg")]
                      if bundle_kind == "full":
                          selected = []
                          for pack in pack_names:
                              pack_sheets = sorted(
                                  name for name in sheets
                                  if name.rsplit("/", 1)[-1].startswith(pack + "-"))
                              if not pack_sheets:
                                  raise RuntimeError(
                                      f"No visual-review sheets for {pack}.")
                              indices = sorted({
                                  0, len(pack_sheets) // 2, len(pack_sheets) - 1})
                              selected.extend(pack_sheets[index] for index in indices)
                      else:
                          selected = sorted(sheets)

                      selected_names = {}
                      for name in selected:
                          basename = name.rsplit("/", 1)[-1]
                          output_name = (basename if bundle_kind == "full"
                                         else "large-" + basename)
                          selected_names[basename] = output_name
                          output.writestr(output_name, source.read(name))
                          selected_count += 1

                      rows = csv.reader(io.StringIO(
                          source.read("manifest.tsv").decode("utf-8")),
                          delimiter="\t")
                      source_header = next(rows)
                      if header is None:
                          header = source_header
                          writer.writerow(header)
                      for row in rows:
                          if row and row[0] in selected_names:
                              row[0] = selected_names[row[0]]
                              writer.writerow(row)
              output.writestr("manifest.tsv", manifest.getvalue())
              output.writestr(
                  "README.txt",
                  "Full-pack previews contain first, middle, and last sheets "
                  "for each pack; large-*.jpg sheets show every source image "
                  "above the very-large-image threshold.\n"
                  "Each sheet shows up to 100 images. manifest.tsv maps every "
                  "thumbnail index to its original ZIP path and dimensions.\n")

          payload = review.getvalue()
          if len(payload) > 700_000:
              raise RuntimeError(
                  f"Selected visual-review bundle is unexpectedly large: "
                  f"{len(payload):,} bytes.")
          encoded = base64.b64encode(payload).decode("ascii")
          digest = hashlib.sha256(payload).hexdigest()
          encoded_chunks = [encoded[offset:offset + 30_000]
                            for offset in range(0, len(encoded), 30_000)]
          endpoint = (f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/"
                      f"{os.environ['GITHUB_SHA']}/comments")
          for part, chunk in enumerate(encoded_chunks, start=1):
              body = (
                  f"Visual review bundle {digest} part {part}/{len(encoded_chunks)}\n\n"
                  "Decode and join these temporary Base64 chunks to view the "
                  "thumbnail-only ZIP.\n\n```text\n" + chunk + "\n```")
              result = subprocess.run(
                  ["gh", "api", "--method", "POST", endpoint,
                   "--field", f"body={body}"],
                  capture_output=True, text=True, check=False)
              if result.returncode:
                  raise RuntimeError(
                      "Could not publish visual-review chunk "
                      f"{part}/{len(encoded_chunks)}: "
                      f"{result.stderr.strip()[-1000:]}")
              if part < len(encoded_chunks):
                  time.sleep(1.0)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Visual review preview bundle\n\n")
              summary.write(
                  f"Published {len(encoded_chunks)} temporary commit-comment "
                  f"chunks for a {len(payload):,}-byte thumbnail-only ZIP "
                  f"(SHA-256 `{digest}`). The bundle contains first, middle, "
                  "and last full-pack sheets plus every very-large-image sheet; "
                  "`manifest.tsv` maps thumbnails to source paths.\n")
          print(f"Published {len(encoded_chunks)} visual-review chunks "
                f"(SHA-256 {digest}).")
          PY
      - name: Upload the real-pack taxonomy audit
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[asset-taxonomy-audit]')))
        uses: actions/upload-artifact@v4
        with:
          name: real-pack-taxonomy-audit
          path: ${{ runner.temp }}/asset-taxonomy-report.md
          if-no-files-found: error
          retention-days: 7
      - name: Publish the taxonomy audit on this commit
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[asset-taxonomy-audit]')))
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/asset-taxonomy-report.md
        run: |
          report_body="$(cat "$REPORT_PATH")"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            --field "body=$report_body" >/dev/null
