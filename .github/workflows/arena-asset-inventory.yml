name: Temporary arena asset inventory

# One-shot scratch workflow for the asset-role review session on
# arena/07a40b4f-alien-map-maker. The sandbox network cannot reach
# release-assets.githubusercontent.com, so the runner dumps the ZIP
# central directories (names + 64-byte image headers, never the pixels)
# to a JSON file committed back to this branch. Remove after use.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/07a40b4f-alien-map-maker
    paths:
      - .github/workflows/arena-asset-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/07a40b4f-alien-map-maker

      - name: Download the three published asset archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/asset-zips"
          gh release download asset-intake-temp-20261006 \
            --repo imclaytonithink/Alien-map-Maker \
            --pattern '*.zip' \
            --dir "$RUNNER_TEMP/asset-zips"
          ls -la "$RUNNER_TEMP/asset-zips"

      - name: Dump full ZIP central directories to JSON
        env:
          ASSET_DIR: ${{ runner.temp }}/asset-zips
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, zipfile

          asset_dir = pathlib.Path(os.environ["ASSET_DIR"])
          IMAGE_EXTS = {".png", ".jpg", ".jpeg", ".webp", ".bmp", ".tiff"}
          inventory = {"archives": []}
          for archive_path in sorted(asset_dir.glob("*.zip")):
              entries = []
              with zipfile.ZipFile(archive_path) as archive:
                  for info in archive.infolist():
                      entry = {
                          "n": info.filename,
                          "d": 1 if info.is_dir() else 0,
                          "s": info.file_size,
                          "c": info.CRC,
                      }
                      suffix = pathlib.PurePosixPath(
                          info.filename.replace("\\", "/")).suffix.lower()
                      if not info.is_dir() and suffix in IMAGE_EXTS:
                          with archive.open(info) as stream:
                              head = stream.read(64)
                          entry["h"] = base64.b64encode(head).decode("ascii")
                      elif (not info.is_dir() and suffix in {".txt", ".htm"}
                              and info.file_size <= 200_000):
                          with archive.open(info) as stream:
                              entry["t"] = stream.read(200_000).decode(
                                  "utf-8", "replace")
                      entries.append(entry)

              inventory["archives"].append({
                  "archive": archive_path.name,
                  "entries": entries,
              })
          out = pathlib.Path("arena-asset-inventory.json")
          out.write_text(json.dumps(inventory, ensure_ascii=False), encoding="utf-8")
          total = sum(len(a["entries"]) for a in inventory["archives"])
          images = sum(1 for a in inventory["archives"]
                       for e in a["entries"] if "h" in e)
          print(f"wrote {out} ({out.stat().st_size:,} bytes)")
          print(f"entries: {total:,}  image entries: {images:,}")
          PY

      - name: Commit the inventory to the arena branch
        run: |
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add arena-asset-inventory.json
          git commit -m "chore: dump asset archive inventory for role review"
          git push origin HEAD:arena/07a40b4f-alien-map-maker
