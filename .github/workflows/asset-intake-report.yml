name: Temporary asset intake report

on:
  push:
    branches:
      - arena/dc8952cc-alien-map-maker
    paths:
      - .github/workflows/asset-intake-report.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Download the three published asset archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/asset-zips"
          gh release download asset-intake-temp-20261006 \
            --repo imclaytonithink/Alien-map-Maker \
            --pattern '*.zip' \
            --dir "$RUNNER_TEMP/asset-zips"

      - name: Inventory archive structure and post report
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIR: ${{ runner.temp }}/asset-zips
        run: |
          python - <<'PY'
          import collections, json, os, pathlib, zipfile

          asset_dir = pathlib.Path(os.environ["ASSET_DIR"])
          report = ["## Temporary asset archive inventory", ""]
          for archive_path in sorted(asset_dir.glob("*.zip")):
              with zipfile.ZipFile(archive_path) as archive:
                  files = [i for i in archive.infolist() if not i.is_dir()]
                  ext_counts = collections.Counter(pathlib.PurePosixPath(i.filename).suffix.lower() or "[no extension]" for i in files)
                  top_dirs = collections.Counter((pathlib.PurePosixPath(i.filename).parts[0] if len(pathlib.PurePosixPath(i.filename).parts) > 1 else "[root]") for i in files)
                  image_samples = []
                  unsafe = 0
                  for info in files:
                      p = pathlib.PurePosixPath(info.filename.replace(chr(92), "/"))
                      if p.is_absolute() or ".." in p.parts:
                          unsafe += 1
                          continue
                      if p.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp"} and len(image_samples) < 12:
                          row = f"- `{info.filename}` — {info.file_size:,} bytes"
                          if p.suffix.lower() == ".png":
                              try:
                                  with archive.open(info) as stream:
                                      header = stream.read(24)
                                  if header[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10)) and header[12:16] == b"IHDR":
                                      row += f", {int.from_bytes(header[16:20], 'big')}×{int.from_bytes(header[20:24], 'big')} px"
                              except Exception:
                                  pass
                          image_samples.append(row)
                  total_unpacked = sum(i.file_size for i in files)
                  report += [
                      f"### `{archive_path.name}`",
                      f"- Archive: {archive_path.stat().st_size:,} bytes; contents: {len(files):,} files, {total_unpacked:,} uncompressed bytes.",
                      f"- Extensions: `{json.dumps(dict(sorted(ext_counts.items())), ensure_ascii=False)}`",
                      f"- Top-level folders: `{json.dumps(dict(top_dirs.most_common(20)), ensure_ascii=False)}`",
                      f"- Unsafe paths skipped from report: {unsafe}",
                      "- Image samples:",
                      *(image_samples or ["- No recognized raster image entries found."]),
                      "",
                  ]
          body = "\n".join(report)
          pathlib.Path("asset-intake-report.md").write_text(body, encoding="utf-8")
          print(body)
          PY
          cat asset-intake-report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment 2 --repo imclaytonithink/Alien-map-Maker --body-file asset-intake-report.md
